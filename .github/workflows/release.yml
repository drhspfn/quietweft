name: Release assets
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Check tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os,tomllib; v=tomllib.load(open('rust/runtime/Cargo.toml','rb'))['package']['version']; assert os.environ['GITHUB_REF_NAME']=='v'+v, 'Tag does not match Cargo version'"
      - run: python scripts/build.py --platform ${{ matrix.platform }} --target all
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/*.zip
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets
      - name: Include pinned model as a standalone asset
        run: python -c "import shutil,tomllib; v=tomllib.load(open('rust/runtime/Cargo.toml','rb'))['package']['version']; shutil.make_archive(f'release-assets/quietweft-{v}-model-gtcrn-dns3-v1','zip','models','gtcrn-dns3-v1')"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
          generate_release_notes: true

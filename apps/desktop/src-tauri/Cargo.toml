[package]
name = "quietweft-desktop"
version = "1.4.4"
edition = "2021"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quietweft-audio = { path = "../../../rust/audio" }
quietweft-runtime = { path = "../../../rust/runtime" }
